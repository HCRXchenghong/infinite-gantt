<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 · 悦享e食</title>
  <link rel="stylesheet" href="/admin-manage/style.css">
</head>
<body>
  <div id="loginView" class="login-wrap" hidden>
    <form class="login-box" id="loginForm">
      <h1>后台管理登录</h1>
      <p class="sub">悦享e食平台 · 时间线管理系统</p>
      <label>用户名<input type="text" id="user" required placeholder="用户名"></label>
      <label>密码<input type="password" id="pass" required placeholder="密码"></label>
      <button type="submit">登 录</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>

  <div id="manageView" class="app" hidden>
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">悦享e食</div>
        <div class="brand-sub">后台管理</div>
      </div>
      <nav class="nav">
        <a class="nav-item active" data-page="events">事件管理</a>
        <a class="nav-item" data-page="roster">人员名单</a>
      </nav>
      <div class="sidebar-foot">
        <a class="btn ghost" href="/" target="_blank">查看前端</a>
        <button class="btn ghost" id="logout">退出登录</button>
      </div>
    </aside>

    <!-- 右侧内容区 -->
    <main class="content">
      <!-- 事件管理页 -->
      <section class="page" id="page-events">
        <div class="page-head">
          <h1 class="page-title">事件管理</h1>
          <button class="btn primary" id="newEventBtn">＋ 新建事件</button>
        </div>

        <div class="card">
          <h2>现有事件 <span class="count" id="count"></span></h2>
          <div id="list"></div>
        </div>
      </section>

      <!-- 人员名单页 -->
      <section class="page" id="page-roster" hidden>
        <h1 class="page-title">人员名单</h1>
        <div class="card">
          <h2>人员名单 <span class="count" id="rosterCount"></span></h2>
          <p class="hint">输入姓名后回车添加；之后在事件里选择负责人时会自动补全。用过的人名会自动进入名单。</p>
          <div class="roster-add">
            <input type="text" id="rosterInput" list="rosterList" placeholder="输入姓名，回车添加">
            <button class="btn primary" id="rosterAdd">添加</button>
          </div>
          <div class="roster-chips" id="rosterChips"></div>
          <datalist id="rosterList"></datalist>
        </div>
      </section>
    </main>
  </div>

  <!-- 事件表单弹窗 -->
  <div class="modal" id="eventModal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="formTitle">新增事件</h2>
        <span class="modal-close" id="modalCloseBtn">×</span>
      </div>
      <form id="eventForm" class="event-form" novalidate>
        <label>事件标题<input type="text" id="title" placeholder="例如：硬件样机测试"></label>
        <label>所属部分
          <select id="part">
            <option value="硬件研发">硬件研发</option>
            <option value="软件开发">软件开发</option>
            <option value="平台运营">平台运营</option>
          </select>
        </label>
        <label>开始时间<input type="date" id="start"></label>
        <label>结束时间<input type="date" id="end"></label>
        <label class="full">负责人
          <span class="hint-inline">输入姓名后回车或点击添加，可多人；同一部分最多 2 个事件在时间上并行</span>
          <div id="eventOwners"></div>
        </label>
        <label class="full">详细说明<textarea id="desc" rows="3" placeholder="事件详细说明（可选）"></textarea></label>
        <div class="form-actions full">
          <button type="submit" class="btn primary" id="saveBtn">保存事件</button>
          <button type="button" class="btn ghost" id="cancelEdit">取消</button>
        </div>
        <p class="err" id="formErr"></p>
      </form>
    </div>
  </div>

  <script src="/admin-manage/app.js"></script>
</body>
</html>
